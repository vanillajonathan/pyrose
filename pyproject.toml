[project]
name = "PyRose"
version = "0.1.0"
description = "Playground for programmers"
readme = "README.md"
license = "MIT"
keywords = ["tools"]
requires-python = ">=3.14"
dependencies = [
    "lsp-types>=0.26.0",
]

classifiers = [
  "Private :: Do Not Upload",
  "Environment :: X11 Applications :: GTK",
  "Environment :: X11 Applications :: Gnome",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development"
]

[dependency-groups]
dev = [
    "pygobject-stubs>=2.17.0,<2.18",  # 2.18+ mistypes @GObject.Signal(...) and View.get_vadjustment()
    "pyrefly>=1.4.1",
    "ruff>=0.17.4",
]

[tool.pyrefly]
project-includes = ["src"]

[tool.uv]
# The app runs against the GNOME runtime's PyGObject; the venv only needs the
# .pyi stubs, so skip compiling PyGObject/pycairo (needs cairo dev headers).
override-dependencies = ["pygobject; sys_platform == 'never'"]
